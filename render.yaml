services:
  - type: web
    name: yantu-kaoyan-dashboard
    runtime: node
    region: singapore
    plan: starter
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: DATABASE_PATH
        value: /var/data/yantu.db
      - key: UPLOAD_ROOT
        value: /var/data/uploads
      - key: REGISTRATION_INVITE_CODE
        sync: false
    disk:
      name: yantu-data
      mountPath: /var/data
      sizeGB: 1
